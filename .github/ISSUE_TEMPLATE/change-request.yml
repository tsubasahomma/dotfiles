name: Change request
description: Describe a repository change and how to check its result.
title: "[Change]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem, intended result, and relevant boundaries.
        See docs/development.md and docs/validation.md for repository guidance.
  - type: textarea
    id: goal
    attributes:
      label: Problem and intended result
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify affected files or host state and any boundaries that matter.
    validations:
      required: true
  - type: textarea
    id: validation_required
    attributes:
      label: How to check the result
      description: Name relevant checks and what they establish. Distinguish planned checks from observed results.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Context and references
      description: Link relevant code, documentation, or related work.
    validations:
      required: false
