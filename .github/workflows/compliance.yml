# Chezmoi state validation stays separate from mise runtime integration.
# [Reference]: https://mise.jdx.dev/continuous-integration.html
# This workflow applies chezmoi first, then runs mise-managed integration checks.
name: compliance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate-config:
    name: Renovate Config Validation
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Pin the validator distribution so CI and local checks use the same Renovate schema.
      # [Reference]: https://docs.renovatebot.com/config-validation/
      RENOVATE_VERSION: "43.150.0"

    steps:
      - name: Checkout Repository
        # Checkout runs on Node.js 24 through FORCE_JAVASCRIPT_ACTIONS_TO_NODE24; Renovate pins the action hash.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve Renovate Shell Node Runtime
        id: renovate-node
        run: |
          node_version="$(sed -n 's/^node = "\([^"]*\)"$/\1/p' dot_config/mise/conf.d/10-tools.toml)"
          case "$node_version" in
            ""|*$'\n'*) exit 1 ;;
          esac
          printf 'Resolved shell Node version: %s\n' "$node_version"
          printf 'node-version=%s\n' "$node_version" >> "$GITHUB_OUTPUT"

      - name: Setup Renovate Shell Node Runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.renovate-node.outputs.node-version }}
          package-manager-cache: false

      - name: Validate Renovate Repository Config
        run: |
          test -f renovate.json5
          node --version
          npx --version
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --version
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  convergence:
    name: Convergence & Idempotency Proof
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ github.token }}
      CI: true

    steps:
      - name: Checkout Repository
        # Checkout runs on Node.js 24 through FORCE_JAVASCRIPT_ACTIONS_TO_NODE24; Renovate pins the action hash.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve Mise Bootstrap Version
        id: mise_version
        shell: bash
        run: |
          if [[ ! -f .mise-version ]]; then
            echo "::error file=.mise-version::.mise-version is required for the mise bootstrap contract."
            exit 1
          fi

          line_count="$(awk 'END { print NR }' .mise-version)"
          mise_version="$(sed -n '1p' .mise-version)"
          if [[ "$line_count" -ne 1 || ! "$mise_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error file=.mise-version::.mise-version must contain exactly one plain mise version like 2026.5.4."
            exit 1
          fi

          printf 'Resolved mise bootstrap version: %s\n' "$mise_version"
          printf 'version=%s\n' "$mise_version" >> "$GITHUB_OUTPUT"

      - name: Prove Bootstrap Repairs Stale Mise
        shell: bash
        env:
          MISE_VERSION: ${{ steps.mise_version.outputs.version }}
        run: |
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT

          mkdir -p "$tmp_home/.local/bin"
          cat > "$tmp_home/.local/bin/mise" <<'STALE_MISE'
          #!/bin/sh
          echo "0.0.0 stale"
          STALE_MISE
          chmod +x "$tmp_home/.local/bin/mise"

          before_version="$("$tmp_home/.local/bin/mise" --version | awk 'NR == 1 { print $1 }')"
          if [[ "$before_version" == "$MISE_VERSION" ]]; then
            echo "::error::Stale mise fixture unexpectedly matches the desired version."
            exit 1
          fi

          HOME="$tmp_home" ./.bootstrap-mise.sh

          repaired_version="$("$tmp_home/.local/bin/mise" --version | awk 'NR == 1 { print $1 }')"
          if [[ "$repaired_version" != "$MISE_VERSION" ]]; then
            echo "::error::Bootstrap did not repair stale hermetic mise: expected $MISE_VERSION, got ${repaired_version:-unavailable}."
            "$tmp_home/.local/bin/mise" --version || true
            exit 1
          fi

      - name: Bootstrap Tier 0 Tools (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ steps.mise_version.outputs.version }}
          install: true
          cache: true

      - name: Bootstrap Hermetic Mise
        shell: bash
        env:
          MISE_VERSION: ${{ steps.mise_version.outputs.version }}
        run: |
          ./.bootstrap-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          hermetic_mise="$HOME/.local/bin/mise"
          if [[ ! -x "$hermetic_mise" ]]; then
            echo "::error::$hermetic_mise is required after bootstrap."
            exit 1
          fi

          hermetic_version="$("$hermetic_mise" --version | awk 'NR == 1 { print $1 }')"
          if [[ "$hermetic_version" != "$MISE_VERSION" ]]; then
            echo "::error::Hermetic mise version mismatch: expected $MISE_VERSION, got ${hermetic_version:-unavailable}."
            "$hermetic_mise" --version || true
            exit 1
          fi

          printf 'Hermetic mise ready: %s (%s)\n' "$hermetic_mise" "$hermetic_version"

      - name: Resolve Post-Apply Mise Install Cache Scope
        id: post_apply_mise_cache_scope
        shell: bash
        run: |
          mise_data_dir="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
          mise_installs_dir="$mise_data_dir/installs"
          mkdir -p "$mise_installs_dir"

          printf 'MISE_DATA_DIR: %s\n' "$mise_data_dir"
          printf 'Mise installs cache path: %s\n' "$mise_installs_dir"
          printf 'Runner OS/arch/image: %s/%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${{ matrix.os }}"

          printf 'installs-dir=%s\n' "$mise_installs_dir" >> "$GITHUB_OUTPUT"

      - name: Restore Post-Apply Mise Installs Cache
        id: post_apply_mise_installs_cache
        # Cache only the supported installs surface; downloads, internal cache,
        # state, and credential paths stay outside the cache.
        # [Reference]: https://mise.jdx.dev/directories.html
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.post_apply_mise_cache_scope.outputs.installs-dir }}
          key: mise-post-apply-installs-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-mise-${{ steps.mise_version.outputs.version }}-${{ hashFiles('.mise-version', '.mise.toml', 'dot_config/mise/conf.d/10-tools.toml', 'dot_config/mise/config.toml.tmpl') }}
          restore-keys: |
            mise-post-apply-installs-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-mise-${{ steps.mise_version.outputs.version }}-

      - name: Report Post-Apply Mise Cache Restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.post_apply_mise_installs_cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.post_apply_mise_installs_cache.outputs.cache-matched-key }}
          CACHE_PATH: ${{ steps.post_apply_mise_cache_scope.outputs.installs-dir }}
          CACHE_PRIMARY_KEY: ${{ steps.post_apply_mise_installs_cache.outputs.cache-primary-key }}
        run: |
          printf 'Post-apply mise installs cache primary key: %s\n' "$CACHE_PRIMARY_KEY"
          printf 'Post-apply mise installs cache matched key: %s\n' "${CACHE_MATCHED_KEY:-none}"
          printf 'Post-apply mise installs cache hit: %s\n' "${CACHE_HIT:-false}"
          tool_count="$(find "$CACHE_PATH" -mindepth 1 -maxdepth 1 -type d 2> /dev/null | wc -l | tr -d '[:space:]')"
          printf 'Post-apply mise installs cache path top-level entries: %s\n' "${tool_count:-0}"

      - name: Phase 1 - Provisioning (Static Apply)
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --apply

      - name: Prove Mise Activation Is Prompt-Free
        shell: bash
        run: |
          mise_config="$HOME/.config/mise/config.toml"
          if [[ ! -f "$mise_config" ]]; then
            echo "::error::$mise_config is required after chezmoi apply."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*credential_command[[:space:]]*=' "$mise_config"; then
            echo "::error file=dot_config/mise/config.toml.tmpl::Global mise config must not define a promptful credential_command."
            exit 1
          fi

          tmp_bin="$(mktemp -d)"
          trap 'rm -rf "$tmp_bin"' EXIT
          cat > "$tmp_bin/op" <<'FAKE_OP'
          #!/bin/sh
          echo "op was invoked during mise activation" > "$OP_CALLED"
          exit 1
          FAKE_OP
          chmod +x "$tmp_bin/op"
          op_called="$tmp_bin/op-called"
          rm -f "$op_called"

          OP_CALLED="$op_called" PATH="$tmp_bin:$PATH" "$HOME/.local/bin/mise" activate zsh >/dev/null
          if [[ -e "$op_called" ]]; then
            echo "::error::mise activation invoked op; GitHub credential lookup is on the shell startup path."
            exit 1
          fi

      - name: Phase 2 - Idempotency Proof (Static Convergence)
        run: |
          # Verify that the applied chezmoi state remains byte-for-byte converged.
          if ! chezmoi verify; then
            echo "❌ [Idempotency Failure] State drift detected."
            chezmoi status
            exit 1
          fi
          echo "✅ [Convergence] Zero-drift confirmed."

      - name: Phase 3 - Application Integration (Dynamic Convergence)
        run: |
          "$HOME/.local/bin/mise" run repair:nvim

      - name: Phase 4 - Final Health Check (Doctor)
        if: always()
        run: |
          "$HOME/.local/bin/mise" run doctor

      - name: Save Post-Apply Mise Installs Cache
        if: ${{ success() && steps.post_apply_mise_installs_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.post_apply_mise_cache_scope.outputs.installs-dir }}
          key: ${{ steps.post_apply_mise_installs_cache.outputs.cache-primary-key }}
