# Static mise tool inventory managed as source state.
# Core runtimes remain explicit before tools that depend on runtime backends.
# [Reference]: https://mise.jdx.dev/configuration.html

[task_config]
# Each global mise config file owns its own task discovery scope.
# Keep this aligned with config.toml.tmpl so conf.d never falls back to
# unmanaged local/private tasks in default discovery paths.
includes = [
    ".config/mise/repo-tasks",
]


[tools]
# --- 1. Infrastructure Core & Runtimes ---
"aqua:twpayne/chezmoi" = "2.74.1"
# usage powers generated mise shell completions; keep it compatible with `mise usage`.
"aqua:jdx/usage" = "3.6.0"
node = "24.22.3"
python = "3.15.2"
pnpm = "11.28.13"
"core:deno" = "2.9.8"
rust = "1.100.0"
go = "1.27.4"
"aqua:astral-sh/uv" = "0.13.9"

