# Ruff is the Python formatter and linter: python3 tests/run_checks.py lint.
# https://docs.astral.sh/ruff/configuration/
line-length = 100
target-version = "py311"
# The entry point re-launches itself on 3.11+, so it must still parse on older Python 3.
per-file-target-version = { "tests/run_checks.py" = "py39" }

[format]
# Keep the existing quote style; a quote rewrite would bury real changes.
quote-style = "preserve"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# The task templates exec() these fragments inside generated_files.py, which
# defines the shared names (Path, sys, regular, fingerprint, ...).
".chezmoitemplates/{bat_cache,pbfile_build,vale_styles}.py" = ["F821"]

[lint.isort]
# Match the existing order: plain and from-imports sorted together.
force-sort-within-sections = true
